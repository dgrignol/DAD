# sub-24.yaml
# Purpose: select participant 24 for the shared DAD MEG pipeline.
# Usage: python meg/code/preprocessing_basic/run_pipeline.py \
#   --config meg/params/pipeline_default.yaml --subject-config meg/params/sub-24.yaml \
#   --preflight-only
# Data flow: this selector chooses the verified profile in pipeline_default.yaml.
subject:
  id: "24"

# Approved recovered epochs are now published in the common cohort run.
# Original recovery selector and scientific settings remain recorded in
# the consolidation receipt; this changes storage/default selection only.
epoching:
  preparation_mode: inline_no_ica
  processing_run: noica-20261117-v2
  auxiliary_reconstruction_manifest: auxiliary_reconstruction/p24-edf-20261117-v1/manifest.json
