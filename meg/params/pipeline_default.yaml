layout:
  subject_bids_id: "sub-01"
  session_bids_id: "ses-01"
  derivatives_preprocessing_template: "preprocessing/{subject_bids_id}/{session_bids_id}"
  derivatives_analysis_template: "analysis/{subject_bids_id}/{session_bids_id}"
  derivatives_reports_template: "reports/{subject_bids_id}/{session_bids_id}"

data_discovery:
  subject_folder_glob_template: "sub{subject_id}_*"
  task_meg_fif_glob_template: "meg/sub{subject_id}_run*.fif"
  trajectory_mat_glob_template: "input_files/MovDot_Sub{subject_id}_V*_rescueTraject.mat"
  trial_struct_mat_glob_template: "input_files/Sub{subject_id}_TrialStruct_v*_rescueTraject.mat"
  behavioral_mat_glob_template: "output_files/MoveDot1_occlusion_v*_rescueTraject_SUB{subject_id}_BLOCK*.mat"
  reported_trigger_csv_glob_template: "output_files/debug_actual_triggers*_sub{subject_id}_block*_run*.csv"
  eyetracker_edf_glob_template: "eyetracker/*.edf"
  empty_room_fif_glob_template: "empty_room_{subject_folder_date}.fif"

trigger_parser:
  stim_channel: "STI101"
  min_duration_sec: 0.0
  transition_max_samples: 1
  expected_lookahead: 6
  alignment_slack_events: 250
  collapse_short_transition_pulses: true
  mark_transition_match_warning: true
  include_width_outliers: false
  enable_deep_confrontation_report: true
  deep_report_output_subdir: "02_triggers_extraction_custum_report_deeper"
  deep_report_variant: "rescueTraject"
  deep_report_anomaly_window_ms: 500.0
  deep_report_transition_window_ms: 3.0
  write_machine_readable_events: true
  write_human_summary: true

preprocessing:
  enable_maxwell_sss: true
  maxwell_st_duration_sec: 10.0
  maxwell_origin: "auto"
  enable_ssp: false
  line_freq_hz: 50.0
  highpass_hz: 0.01
  lowpass_hz: 40.0
  notch_freqs_hz: [50.0, 100.0]
  resample_sfreq_hz: null
  annotate_artifacts: true
  preserve_misc_channels: true

# Stage 03_A. Facility calibration resources are project inputs and are not
# discovered from any subject raw folder. Bad channels detected in any run are
# applied to all runs by default. Each static dev_head_t is mapped to the most
# central actual acquisition run.
maxwell_filter:
  enabled: true
  crosstalk_file: "/Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/data/fwmegmaxfilter/ct_sparse_triux2.fif"
  calibration_file: "/Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/data/fwmegmaxfilter/sss_cal_3182_250410.dat"
  bad_channel_policy: "union"
  reference_acquisition_run: null
  manual_bad_channels:
    add: []
    remove: []
    by_run: {}
  destination:
    policy: "central_run"
    acquisition_run: null
  find_bad_channels:
    limit: 7.0
    duration_sec: 5.0
    min_count: 5
    origin: "auto"
    h_freq_hz: 40.0
  filter:
    origin: "auto"
    st_duration_sec: null
    st_correlation: 0.98

# Stage 03_B. FLUX's muscle threshold of 10 is retained for noninteractive
# review runs. `auto` EOG mode becomes diagnostics-only when profile EOG
# channels exist and disabled otherwise; it never uses EDF files.
artifact_annotation:
  enabled: true
  muscle_threshold: 10.0
  muscle_threshold_by_run: {}
  muscle_channel_type: "mag"
  muscle_min_length_good_sec: 0.2
  muscle_filter_freq_hz: [110.0, 140.0]
  eog_mode: "auto"
  eog_channel_names: []
  blink_channel: null
  blink_tmin_sec: -0.25
  blink_tmax_sec: 0.25

# Stage 03_C manual branch. A null exclusion list means that component review
# has not been completed. An empty list means reviewed with no exclusions.
ica:
  enabled: true
  method: "fastica"
  n_components: 30
  random_state: 97
  max_iter: "auto"
  fit_resample_sfreq_hz: 200.0
  fit_l_freq_hz: 1.0
  fit_h_freq_hz: 40.0
  reuse_prefit: true
  manual_exclude: null
  eog_channel_names: []
  eog_diagnostics: true
  eog_guided_score_threshold: 0.6
  ecg_channel_names: []

# The automatic MEGNet branch is retained only as deprecated experimental code.
# It is not registered in run_pipeline.py and must not be used for production.
ica_auto:
  deprecated: true
  production_enabled: false

epoching:
  enabled: true
  tmin_sec: -0.5
  tmax_sec: 2.667
  baseline_sec: null
  detrend: 1
  reject_by_annotation: true
  event_id_map: {}
  identity_range: []
  amplitude_reject:
    grad: 5.0e-10
    mag: 4.0e-12
  trial_exclusion:
    # Behavioral trigger evidence is evaluated inside each acquisition run.
    # Replay trials remain included because they were actually presented/saved.
    gaze_break_codes: [150]
    catch_type_1_codes: [116, 117]
    catch_type_2_codes: [113, 118, 201, 202]
    esc_termination_codes: [152]
    exclude_gaze_break: true
    exclude_catch_type_1: true
    exclude_catch_type_2: true
    exclude_esc_termination: true
    exclude_replay_trials: false
    exclude_unresolved_transitions: true

export:
  enabled: true
  output_format: "mat"
  tmin_sec: 0.0
  tmax_sec: 2.667
  sampling_rate_hz: 120.0
  canonical_meg_channels_file: "code/preprocessing_basic/drsa_canonical_meg_channels.txt"
  missing_identity_policy: "error"
  bad_or_missing_channel_policy: "nan"
  include_epochs_metadata: true

matlab_drsa:
  enabled: true
  matlab_bin: "/Applications/MATLAB_R2020a.app/bin/matlab"
  use_arch_x86_64: false
  analyses: ["real"]
  drsa_type: "corr"
  conditions_to_run: ["always_visible", "occluded_nondeviant", "occluded_deviant"]
  sensor_groups_to_run: ["wholeBrain"]
  model_source: "observed"
  pcr_strategy: "baseline_pcr_border"
  smooth_neural: true
  smooth_window_samples: 15
  smoothing_plots: false
  plot_smoothing_window: 9
  group_average_subjects: ["01", "02", "03", "04", "05", "06", "07"]
  # 1-based stimulus frame indices converted to seconds as (frame - 1) / Hz.
  occlusion_timing:
    frame_frequency_hz: 120.0
    first_complete_occlusion_frame: 130
    reappearance_frame: 191

eye_model:
  enabled: true
  skip_if_missing: true
  skip_reason_when_missing: "No saved EDF eye-tracker input exists for this subject."
  edf_to_meg_synchronization: "deferred"

runtime:
  stop_on_error: true
  save_intermediates: true
  overwrite_existing: false
  log_level: "INFO"
