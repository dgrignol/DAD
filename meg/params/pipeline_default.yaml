# pipeline_default.yaml
#
# Purpose:
#   Define shared MEG pipeline settings and the verified profiles for all seven
#   participants in the external read-only dataset. Subject YAML files contain
#   only the selected subject ID; pipeline_config.py derives labels, trigger
#   ranges, condition maps, ocular settings, and discovery globs from the
#   selected profile.
#
# Usage examples:
#   1) Validate one subject without writing outputs:
#      python /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/code/preprocessing_basic/pipeline_config.py \
#        --config /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/params/pipeline_default.yaml \
#        --subject-config /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/params/sub-04.yaml \
#        --validate-only --print-summary
#
#   2) Run read-only preflight and preview the registered stage:
#      python /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/code/preprocessing_basic/run_pipeline.py \
#        --config /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/params/pipeline_default.yaml \
#        --subject-config /Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg/params/sub-04.yaml \
#        --dry-run
#
# Data flow:
#   subject.id -> verified subject profile -> unique external subNN_* folder ->
#   source discovery -> optional inventory + durable source manifest -> numbered
#   scientific transformations.

project:
  root: "/Users/damiano/Documents/UniTn/Dynamo/Attention/DAD/meg"
  data_root: "/Volumes/MORWUR/Projects/DAMIANO/Attention/data"
