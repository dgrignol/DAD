# environment.yml
#
# Purpose
# Define the headless Python environment used by DAD MEG jobs on DIPSEN.
# Core packages come from conda-forge binaries. The pinned EDF reader uses a
# wheel with its bundled EDFAPI library; no source/compiler build is needed.
# GUI backends and deprecated automatic-ICA dependencies are excluded.
#
# Create a new environment inside a short SLURM interactive allocation:
#   micromamba create -y -f meg/cluster/environment.yml
#
# The conservative version pins form a mutually compatible Python 3.11 stack
# and keep the first cluster pass reproducible.

name: dad-meg
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pyyaml=6.0
  - numpy=1.26
  - scipy=1.13
  - h5py=3.11
  # MNE 1.9 and earlier do not read the Polhemus extra points embedded in
  # these task FIFs. MNE 1.10 is required for origin="auto" in Maxwell steps.
  - mne=1.10.2
  - matplotlib=3.8
  - pandas=2.2
  - scikit-learn=1.5
  # Same EDF reader as the existing exploration, including its native EDFAPI.
  - pip
  - pip:
      - eyelinkio==0.3.0
